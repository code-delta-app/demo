# Meridian Helpdesk — local stack. Synthetic sample for the CodeDelta demo.
services:
  helpdesk:
    build: .
    image: registry.example.invalid/meridian/helpdesk:2.0
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on: [ollama]
  ollama:
    image: registry.example.invalid/mirror/ollama:latest
    volumes: ['ollama:/root/.ollama']
volumes:
  ollama: {}
