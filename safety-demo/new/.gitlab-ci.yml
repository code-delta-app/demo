# Meridian Helpdesk — GitLab pipeline (mirror of the GitHub one)
stages: [test, fix]
test:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - python -m pytest -q tests
autofix:
  stage: fix
  image: node:20
  when: on_failure
  script:
    - npm install -g @openai/codex
    - codex exec --dangerously-bypass-approvals-and-sandbox "fix the failing tests"
