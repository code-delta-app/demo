name: release
on:
  push:
    tags: ['v*']
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t registry.example.invalid/meridian/helpdesk:${GITHUB_REF_NAME} .
      - run: docker push registry.example.invalid/meridian/helpdesk:${GITHUB_REF_NAME}
